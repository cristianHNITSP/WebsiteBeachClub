# nginx.conf / site.conf
server {
  listen 80;
  server_name hotelesfrida.duckdns.org;

  # si subes imágenes / archivos
  client_max_body_size 25m;

  root /usr/share/nginx/html;

  # Si visitas "/" -> redirige al subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  # Redirige SIN slash → CON slash
  location = /hotelesfrida.app {
    return 302 /hotelesfrida.app/;
  }

  # =====================================================
  # COMPAT: si por error alguien pega /hotelesfrida.app/api/...
  # lo reescribimos a /api/... para que caiga en los proxies reales
  # =====================================================
  location ^~ /hotelesfrida.app/api/ {
    rewrite ^/hotelesfrida\.app(/api/.*)$ $1 last;
  }

  location ^~ /hotelesfrida.app/uploads/ {
    rewrite ^/hotelesfrida\.app(/uploads/.*)$ $1 last;
  }

  location ^~ /hotelesfrida.app/socket.io/ {
    rewrite ^/hotelesfrida\.app(/socket\.io/.*)$ $1 last;
  }

  # ==========================
  # Normaliza endpoints sin slash (opcional)
  # ==========================
  location = /api/events       { return 308 /api/events/; }
  location = /api/habitaciones { return 308 /api/habitaciones/; }
  location = /api/hero-slides  { return 308 /api/hero-slides/; }
  location = /api/reservas     { return 308 /api/reservas/; }
  location = /api/shop         { return 308 /api/shop/; }
  location = /api/sedes        { return 308 /api/sedes/; }
  location = /uploads          { return 308 /uploads/; }

  # ==========================
  # FRONTEND bajo subpath (SPA)
  # (sin ^~ para permitir regex de assets si luego la agregas)
  # ==========================
  location /hotelesfrida.app/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /hotelesfrida.app/index.html;
  }

  # ==========================
  # EVENTS -> events-service
  # ==========================
  location ^~ /api/events/ {
    proxy_pass http://beachclub-events-service:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # IMÁGENES /uploads (resueltas por reservas-service)
  # ==========================
  location ^~ /uploads/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # ==========================
  # Socket.IO (WebSocket)
  # ==========================
  location /socket.io/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # API -> shop-service (ANTES de /api catch-all)
  # ==========================
  location ^~ /api/shop/ {
    proxy_pass http://beachclub-shop-service:4003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # API -> reservas-service
  # ==========================
  location ^~ /api/reservas/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/habitaciones/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/hero-slides/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/sedes/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # API -> users-service (catch-all)
  # ==========================
  location ^~ /api/ {
    proxy_pass http://beachclub-users-service:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
