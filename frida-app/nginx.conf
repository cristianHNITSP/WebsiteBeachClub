server {
    listen 80;
    listen [::]:80;
    server_name 129.212.185.62;

    # -----------------------------------------------------
    # FRONTEND (frida-app) – sirves desde proxy a puerto 4200
    # -----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # -----------------------------------------------------
    # USERS-SERVICE (Auth y Usuarios) → Puerto 4001
    # -----------------------------------------------------
    location /api/auth/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fix: /api/auth sin slash
    location = /api/auth {
        return 308 /api/auth/;
    }

    # -----------------------------------------------------
    # RESERVAS-SERVICE → Puerto 4002
    # -----------------------------------------------------

    location /api/reservas/ {
        proxy_pass http://127.0.0.1:4002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fix: /api/reservas sin slash
    location = /api/reservas {
        return 308 /api/reservas/;
    }

    # -----------------------------------------------------
    # SOCKET.IO DEL SERVICIO DE RESERVAS (habitaciones, etc.)
    # -----------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4002/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
