server {
  listen 80;
  server_name _;

  # Aquí está el build (Vite dist copiado a /usr/share/nginx/html)
  root /usr/share/nginx/html;

  # Si visitas / -> manda al subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  # FRONTEND bajo subpath:
  # - Le quitamos "/hotelesfrida.app" a la URL para que /assets/* exista en el filesystem
  # - Y dejamos fallback a index.html para SPA
  location ^~ /hotelesfrida.app/ {
    rewrite ^/hotelesfrida\.app(/.*)$ $1 break;
    try_files $uri $uri/ /index.html;
  }

  # -------- API PROXIES (igual que en tu dev) --------
  location /api/reservas/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/habitaciones/ { proxy_pass http://beachclub-reservas-service:4002; }
  location /api/hero-slides/ { proxy_pass http://beachclub-reservas-service:4002; }

  # Si "events" vive fuera de docker en el HOST
  location /api/events/ {
    proxy_pass http://host.docker.internal:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://beachclub-users-service:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # -------- WebSocket Socket.IO --------
  location /socket.io/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}