server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Si visitas "/" -> redirige al subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  # --- FIX IMPORTANTE ---
  # Redirige SIN slash → CON slash
  location = /hotelesfrida.app {
    return 302 /hotelesfrida.app/;
  }

  # FRONTEND bajo subpath (SPA)
  location ^~ /hotelesfrida.app/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /hotelesfrida.app/index.html;
  }

  # -------- API PROXIES --------
  location /api/reservas/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/habitaciones/ { 
    proxy_pass http://beachclub-reservas-service:4002; 
  }

  location /api/hero-slides/ { 
    proxy_pass http://beachclub-reservas-service:4002; 
  }

  location /api/events/ {
    proxy_pass http://host.docker.internal:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://beachclub-users-service:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # -------- WebSocket Socket.IO --------
  location /socket.io/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}
