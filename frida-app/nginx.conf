server {
  listen 80;
  server_name _;

  # 1) Servir el frontend en /hotelesfrida.app/
  location /hotelesfrida.app/ {
    alias /usr/share/nginx/html/hotelesfrida.app/;
    try_files $uri $uri/ /hotelesfrida.app/index.html;
  }

  # (Opcional) si visitas /, redirige al subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  # 2) Proxy HTTP a microservicios (mismos paths que usas en Vite)
  location /api/reservas/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/habitaciones/ { proxy_pass http://beachclub-reservas-service:4002; }
  location /api/hero-slides/ { proxy_pass http://beachclub-reservas-service:4002; }

  location /api/events/ {
    proxy_pass http://host.docker.internal:5050; # si events vive fuera de docker
  }

  location /api/ {
    proxy_pass http://beachclub-users-service:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 3) Proxy WebSocket Socket.IO
  location /socket.io/ {
    proxy_pass http://beachclub-reservas-service:4002;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}
