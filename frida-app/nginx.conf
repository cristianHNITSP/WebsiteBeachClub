server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Si visitas "/" -> redirige al subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  # Redirige SIN slash → CON slash
  location = /hotelesfrida.app {
    return 302 /hotelesfrida.app/;
  }

  # ==========================
  # FIX: normalizar endpoints sin slash
  # (evita 404 cuando frontend pega a /api/habitaciones sin /)
  # ==========================
  location = /api/habitaciones { return 308 /api/habitaciones/; }
  location = /api/hero-slides  { return 308 /api/hero-slides/; }
  location = /api/reservas     { return 308 /api/reservas/; }
  location = /api/shop { return 308 /api/shop/; }


  # ==========================
  # FRONTEND bajo subpath (SPA)
  # ==========================
  location ^~ /hotelesfrida.app/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /hotelesfrida.app/index.html;
  }


  # ==========================
  # API -> shop-service
  # (ANTES de /api/ catch-all)
  # ==========================
  location ^~ /api/shop/ {
    proxy_pass http://beachclub-shop-service:4003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # API -> reservas-service
  # IMPORTANTE: con "/" final en location
  # ==========================
  location ^~ /api/reservas/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/habitaciones/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/hero-slides/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # (Opcional) si de verdad usas events en prod:
  # location ^~ /api/events/ {
  #   proxy_pass http://host.docker.internal:5050;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # ==========================
  # API -> users-service (catch-all)
  # debe ir DESPUÉS de las rutas anteriores
  # ==========================
  location ^~ /api/ {
    proxy_pass http://beachclub-users-service:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================
  # WebSocket Socket.IO
  # ==========================
  location /socket.io/ {
    proxy_pass http://beachclub-reservas-service:4002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}
