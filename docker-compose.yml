# ============================================================================
# BeachClub / Hoteles Frida — PRODUCCIÓN (5 contenedores, PLAN-BACKEND §2)
#
#   frontend  Nginx: TLS, el panel compilado, proxy y microcaché de /api
#   api       FastAPI (uvicorn)            ┐ la misma imagen
#   celery    worker + beat (UN solo)      ┘ beachclub-backend
#   postgres  la verdad (volumen propio)
#   redis     caché, cola de Celery, pub/sub, límites
#
# Desarrollo NO pasa por aquí: docker-compose.dev.yml.
#
#     ./scripts/deploy.sh             # lo que corre el despliegue automático
#
# Secretos: .env en la raíz (lo regenera el workflow desde los Secrets de
# GitHub). Lo que no es secreto va fijo aquí. Ver docs/deploy-config-REFERENCIA.md.
# Solo `frontend` publica puertos: lo demás solo se alcanza por la red interna.
# ============================================================================
name: beachclub

# Ajustes NO secretos del backend (los mismos nombres que en desarrollo).
x-ajustes-backend: &ajustes-backend
  ENTORNO: produccion
  DB_HOST: postgres
  POSTGRES_DB: beachclub
  POSTGRES_USER: beachclub_migraciones
  API_DB_USUARIO: beachclub_api
  REDIS_URL: redis://redis:6379/0
  FOTOS_DIR: /datos/fotos
  # Fail-fast: sin estos en .env, Compose ni siquiera compone (y la API, además,
  # se niega a arrancar con un valor de relleno o corto).
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver docs/deploy-config-REFERENCIA.md)}
  API_DB_CLAVE: ${API_DB_CLAVE:?Falta API_DB_CLAVE en .env}
  JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env}
  CLAVE_WEBHOOKS: ${CLAVE_WEBHOOKS:?Falta CLAVE_WEBHOOKS en .env}
  # Opcional: sin ella el bot no busca y lo dice en el panel.
  BRAVE_SEARCH_CLAVE: ${BRAVE_SEARCH_CLAVE:-}

x-backend: &backend
  build:
    context: ./backend
    target: prod
  # Nombre fijo: deploy.sh revierte re-etiquetando la imagen anterior con ESTE nombre.
  image: beachclub-backend:latest
  environment: *ajustes-backend
  volumes:
    - fotos:/datos/fotos  # las escriben api y celery; Nginx solo las lee
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M

services:
  frontend:
    build:
      context: ./frontend
      target: prod
    # Nombre fijo de imagen: deploy.sh revierte re-etiquetando la anterior con
    # ESTE nombre. Con un nombre distinto, `up` volvería a usar la imagen rota.
    image: beachclub-frontend:latest
    environment:
      # Fail-fast: sin DOMINIO en .env, Compose ni siquiera compone.
      BEACHCLUB_DOMINIO: ${DOMINIO:?Falta DOMINIO en .env (ver docs/deploy-config-REFERENCIA.md)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Fotos de las habitaciones: las escribe la API, Nginx solo las lee (PLAN-BACKEND §18).
      - fotos:/datos/fotos:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  celery:
    <<: *backend
    # Beat dentro del worker: hay UN solo contenedor celery (dos beats lanzarían
    # cada tarea dos veces, PLAN-BACKEND §2). Su estado, fuera del código.
    command: ["celery", "-A", "app.tareas", "worker", "--beat", "--schedule", "/tmp/celerybeat-schedule", "-Q", "default", "--concurrency", "2", "--loglevel", "INFO"]

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: beachclub
      POSTGRES_USER: beachclub_migraciones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      # Para 01-usuarios.sh (solo la PRIMERA vez que se crea el volumen).
      API_DB_USUARIO: beachclub_api
      API_DB_CLAVE: ${API_DB_CLAVE:?Falta API_DB_CLAVE en .env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./backend/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:8.10-alpine
    # Caché con TTL siempre; volatile-lru nunca desaloja la cola de Celery (PLAN-BACKEND §12).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M

volumes:
  # Fotos (WebP). Entran en los respaldos junto con la base (scripts/respaldo.sh).
  fotos:
  postgres:
  redis:
