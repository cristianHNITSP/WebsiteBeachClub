#version: "3.9"

#COMANDOS PARA LEVANTAR Y DETENER LOS SERVICIOS DOCKER CON DOCKER COMPOSE:
#LEVANTA LOS SERIVICIOS SIN GENERAR LOGS EN CONSOLA
# dev:    sudo docker compose --profile dev  up --build -d
# prod:   sudo docker compose --profile prod up --build -d
# down:   sudo docker compose down --remove-orphans

#----------------------------------------------------------------------------------------
# COMANDOS PARA SEMBRAR DATOS DE PRUEBA EN LOS SERVICIOS:

#COMANDOS PROD
#sudo docker exec -it beachclub-users-service-prod node src/seed/seed-users.js
#sudo docker exec -it beachclub-reservas-service-prod node src/seed/seed-data.js

#COMANDOS DEV
#sudo docker exec -it beachclub-users-service-dev node src/seed/seed-users.js
#sudo docker exec -it beachclub-users-service-dev node src/seed/seed-sedes.js
#sudo docker exec -it beachclub-reservas-service-dev node src/seed/seed-data.js
#sudo docker exec -it beachclub-shop-service-dev node src/seed/seed-shop.js

#COMANDOS PROD
#sudo docker exec -it beachclub-users-service-prod node src/seed/seed-users.js
#sudo docker exec -it beachclub-users-service-prod node src/seed/seed-sedes.js
#sudo docker exec -it beachclub-reservas-service-prod node src/seed/seed-data.js
#sudo docker exec -it beachclub-shop-service-prod node src/seed/seed-shop.js

#----------------------------------------------------------------------------------------
# VER LOS LOGS DE LOS SERVICIOS:
# sudo docker logs -f beachclub-users-service-dev
# sudo docker logs rsboapp-inventory
# sudo docker logs -f rsboapp-auth

services:
  # =========================
  # FRIDA APP (DEV - Vite)
  # =========================
  frida-app-dev:
    image: node:22-alpine
    container_name: frida-app-dev
    working_dir: /app
    volumes:
      - ./frida-app:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5175:5173"   
    environment:
      NODE_ENV: development
      VITE_RESERVAS_TARGET: "http://beachclub-reservas-service:4002"
      VITE_USERS_TARGET: "http://beachclub-users-service:4001"
      VITE_EVENTS_TARGET: "http://host.docker.internal:5050"
      VITE_RESERVAS_WS_URL: "http://localhost:4102"
      VITE_SHOP_TARGET: "http://beachclub-shop-service:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      - beachclub-net

  # =========================
  # FRIDA APP (PROD - Nginx)
  #  - Solo local (127.0.0.1) para publicarlo con Nginx del host (80/443)
  # =========================
  frida-app:
    build:
      context: ./frida-app
      dockerfile: Dockerfile
      target: prod
    container_name: frida-app-prod
    ports:
      - "127.0.0.1:4200:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: ["prod"]
    networks:
      - beachclub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  # =========================
  # FRONTEND (DEV - Vite)
  # =========================
  frontend-dev:
    image: node:22-alpine
    container_name: frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5176:5173"
    environment:
      NODE_ENV: development
      VITE_RESERVAS_TARGET: "http://beachclub-reservas-service:4002"
      VITE_USERS_TARGET: "http://beachclub-users-service:4001"
      VITE_SHOP_TARGET: "http://beachclub-shop-service:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      - beachclub-net

  # =========================
  # FRONTEND (PROD - Nginx)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: frontend-prod
    ports:
      - "127.0.0.1:4201:80"
    restart: unless-stopped
    profiles: ["prod"]
    networks:
      - beachclub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  # =========================
  # MongoDB BeachClub
  # =========================
  beachclub-mongo:
    image: mongo:6
    container_name: beachclub-mongo
    ports:
      - "127.0.0.1:27029:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - beachclub-mongo-data:/data/db
    restart: always
    networks:
      - beachclub-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # =========================
  # Mongo Express (DEV only)
  # =========================
  beachclub-mongo-express:
    image: mongo-express
    container_name: beachclub-mongo-express
    ports:
      - "127.0.0.1:18082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: beachclubapp
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-change_me}
      ME_CONFIG_SITE_BASEURL: "/"
    depends_on:
      - beachclub-mongo
    restart: unless-stopped
    networks:
      - beachclub-net
    profiles: ["dev"]

  # ======================================================
  # USERS SERVICE (DEV) -> alias: beachclub-users-service
  # ======================================================
  beachclub-users-service-dev:
    build:
      context: ./users-service
    container_name: beachclub-users-service-dev
    env_file:
      - ./users-service/.env
    environment:
      NODE_ENV: development
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_auth?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "4101:4001"
    volumes:
      - ./users-service:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      beachclub-net:
        aliases:
          - beachclub-users-service

  # ==========================================
  # USERS SERVICE (PROD)
  # ==========================================
  beachclub-users-service:
    build:
      context: ./users-service
    container_name: beachclub-users-service-prod
    env_file:
      - ./users-service/.env
    environment:
      NODE_ENV: production
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_auth?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "127.0.0.1:4101:4001"
    restart: unless-stopped
    profiles: ["prod"]
    networks:
      - beachclub-net

  # ==========================================================
  # RESERVAS SERVICE (DEV) -> alias: beachclub-reservas-service
  # ==========================================================
  beachclub-reservas-service-dev:
    build:
      context: ./reservas-service
    container_name: beachclub-reservas-service-dev
    env_file:
      - ./reservas-service/.env
    environment:
      NODE_ENV: development
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_reservas?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "4102:4002"
    volumes:
      - ./reservas-service:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      beachclub-net:
        aliases:
          - beachclub-reservas-service

  # ==========================================
  # RESERVAS SERVICE (PROD)
  # ==========================================
  beachclub-reservas-service:
    build:
      context: ./reservas-service
    container_name: beachclub-reservas-service-prod
    env_file:
      - ./reservas-service/.env
    environment:
      NODE_ENV: production
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_reservas?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "127.0.0.1:4102:4002"
    restart: unless-stopped
    profiles: ["prod"]
    networks:
      - beachclub-net

  beachclub-shop-service-dev:
    build:
      context: ./shop-service
    container_name: beachclub-shop-service-dev
    env_file:
      - ./shop-service/.env
    environment:
      NODE_ENV: development
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_shop?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "4103:4003"
    volumes:
      - ./shop-service:/app
      - /app/node_modules
    command: sh -c "npm run dev"
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      beachclub-net:
        aliases:
          - beachclub-shop-service
  
  # ==========================================
  # SHOP SERVICE (PROD)
  # ==========================================
  beachclub-shop-service:
    build:
      context: ./shop-service
    container_name: beachclub-shop-service-prod
    env_file:
      - ./shop-service/.env
    environment:
      NODE_ENV: production
      MONGO_URI: "mongodb://root:${MONGO_PASSWORD}@beachclub-mongo:27017/beachclub_shop?authSource=admin"
    depends_on:
      - beachclub-mongo
    ports:
      - "127.0.0.1:4103:4003"
    restart: unless-stopped
    profiles: ["prod"]
    networks:
      - beachclub-net

networks:
  beachclub-net:
    driver: bridge

volumes:
  beachclub-mongo-data:
    driver: local
