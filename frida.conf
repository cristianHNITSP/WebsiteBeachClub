server {
  listen 80;
  server_name hotelesfrida.duckdns.org;

  client_max_body_size 25m;

  # "/" -> subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  location = /hotelesfrida.app {
    return 302 /hotelesfrida.app/;
  }

  # =====================================================
  # COMPAT ROBUSTO: cubre /hotelesfrida.app/api (con o sin slash)
  # y lo reescribe a /api...
  # =====================================================
  location ^~ /hotelesfrida.app/api {
    rewrite ^/hotelesfrida\.app(/api.*)$ $1 last;
  }

  location ^~ /hotelesfrida.app/uploads {
    rewrite ^/hotelesfrida\.app(/uploads.*)$ $1 last;
  }

  location ^~ /hotelesfrida.app/socket.io {
    rewrite ^/hotelesfrida\.app(/socket\.io.*)$ $1 last;
  }

  # =====================================================
  # FRONTEND bajo subpath -> frida-app en 4200
  # (IMPORTANTE el slash final para “strip” del subpath)
  # =====================================================
  location ^~ /hotelesfrida.app/ {
    proxy_pass http://127.0.0.1:4200/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =====================================================
  # Uploads (reservas-service)
  # =====================================================
  location = /uploads { return 308 /uploads/; }

  location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # =====================================================
  # Socket.IO (reservas-service)
  # =====================================================
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =====================================================
  # SHOP (antes del catch-all /api)
  # =====================================================
  location = /api/shop { return 308 /api/shop/; }

  location ^~ /api/shop/ {
    proxy_pass http://127.0.0.1:4103;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =====================================================
  # RESERVAS / HABITACIONES / HERO (reservas-service)
  # =====================================================
  location = /api/reservas { return 308 /api/reservas/; }
  location = /api/habitaciones { return 308 /api/habitaciones/; }
  location = /api/hero-slides { return 308 /api/hero-slides/; }

  location ^~ /api/reservas/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/habitaciones/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/hero-slides/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =====================================================
  # SEDES: define 1 "fuente de verdad" para el frontend
  # Recomendado: users-service (4101)
  # =====================================================
  location = /api/sedes { return 308 /api/sedes/; }

  location ^~ /api/sedes/ {
    proxy_pass http://127.0.0.1:4101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =====================================================
  # CATCH-ALL /api -> users-service
  # =====================================================
  location = /api { return 308 /api/; }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
