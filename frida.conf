server {
  listen 80;
  server_name hotelesfrida.duckdns.org;

  client_max_body_size 25m;

  # "/" -> subpath
  location = / {
    return 302 /hotelesfrida.app/;
  }

  location = /hotelesfrida.app {
    return 302 /hotelesfrida.app/;
  }

  # compat: /hotelesfrida.app/api/... -> /api/...
  location ^~ /hotelesfrida.app/api/ {
    rewrite ^/hotelesfrida\.app(/api/.*)$ $1 last;
  }
  location ^~ /hotelesfrida.app/uploads/ {
    rewrite ^/hotelesfrida\.app(/uploads/.*)$ $1 last;
  }
  location ^~ /hotelesfrida.app/socket.io/ {
    rewrite ^/hotelesfrida\.app(/socket\.io/.*)$ $1 last;
  }

  # Frontend bajo subpath -> contenedor frida-app (publicado en 4200)
  location ^~ /hotelesfrida.app/ {
    proxy_pass http://127.0.0.1:4200/;  # IMPORTANTE el slash final
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # uploads -> reservas
  location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # socket.io -> reservas (websocket)
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4102;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # shop -> shop service
  location ^~ /api/shop/ {
    proxy_pass http://127.0.0.1:4103;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # reservas / habitaciones / sedes / hero-slides -> reservas service
  location ^~ /api/reservas/ { proxy_pass http://127.0.0.1:4102; }
  location ^~ /api/habitaciones/ { proxy_pass http://127.0.0.1:4102; }
  location ^~ /api/hero-slides/ { proxy_pass http://127.0.0.1:4102; }
  location ^~ /api/sedes/ { proxy_pass http://127.0.0.1:4102; }

  # headers comunes para esos proxy_pass (nginx no “hereda” dentro de bloques separados)
  location ~ ^/api/(reservas|habitaciones|hero-slides|sedes)/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # catch-all api -> users
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
