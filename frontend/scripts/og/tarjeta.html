<!doctype html>
<!--
  Fuente de la vista previa al compartir un enlace (WhatsApp, Telegram, Facebook…): public/og-reservas-frida.png.
  Esas apps no muestran SVG: hace falta PNG de 1200×630. Para regenerarla tras cambiar algo aquí:
    P=$(mktemp -d); firefox --headless --no-remote --profile "$P" --window-size=1200,630 \
      --screenshot public/og-reservas-frida.png "file://$PWD/scripts/og/tarjeta.html"
  (desde frontend/; si la letra sale de reemplazo, vuelve a correrlo: las fuentes vienen de Google).
  Los hex son los de las flores del logo (site.css): esto es una imagen, no un componente.
-->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Cabin:wght@500;600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FFFFFF; }
  .lienzo { width: 1200px; height: 630px; display: grid; grid-template-rows: 1fr 168px; }
  .marca { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 18px; }
  .corona { width: 560px; height: auto; margin-bottom: -26px; }
  .palabra { display: flex; align-items: baseline; gap: 22px; }
  .reservas { font-family: 'Cabin'; font-weight: 600; font-size: 46px; color: #5B4A6B; }
  .frida { font-family: 'Chewy'; font-size: 168px; line-height: 1; letter-spacing: 0.04em; color: #7A32C0; }
  .franja { background: #7A32C0; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; }
  .lugar { font-family: 'Cabin'; }
  .lugar b { display: block; font-weight: 600; font-size: 40px; }
  .lugar span { display: block; font-weight: 500; font-size: 28px; opacity: 0.92; margin-top: 6px; }
  .dominio { font-family: 'Cabin'; font-weight: 500; font-size: 26px; opacity: 0.92; }
</style></head>
<body><div class="lienzo">
  <div class="marca">
    <svg class="corona" viewBox="0 0 120 44" aria-hidden="true">
      <defs>
        <g id="flor"><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(0)"/><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(60)"/><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(120)"/><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(180)"/><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(240)"/><ellipse rx="0.42" ry="0.62" cy="-0.5" transform="rotate(300)"/></g>
      </defs>
      <g fill="#405818">
        <ellipse cx="10" cy="30" rx="7" ry="3" transform="rotate(-30 10 30)"/><ellipse cx="110" cy="30" rx="7" ry="3" transform="rotate(30 110 30)"/>
        <ellipse cx="44" cy="10" rx="7" ry="3" transform="rotate(-60 44 10)"/><ellipse cx="80" cy="8" rx="7" ry="3" transform="rotate(50 80 8)"/>
        <ellipse cx="62" cy="40" rx="7" ry="3"/>
      </g>
      <g transform="translate(20 30) scale(10)" fill="#4EC8BC"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
      <g transform="translate(38 25) scale(11)" fill="#A848B8"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
      <g transform="translate(58 27) scale(13)" fill="#F5333A"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
      <g transform="translate(80 20) scale(14)" fill="#7A32C0"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
      <g transform="translate(100 28) scale(11)" fill="#F89010"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
      <g transform="translate(60 9) scale(7)" fill="#F89010"><use href="#flor"/><circle r="0.3" fill="#E8A828"/></g>
    </svg>
    <div class="palabra"><span class="reservas">Reservas</span><span class="frida">FRIDA</span></div>
  </div>
  <div class="franja">
    <div class="lugar"><b>Cabañas Frida y Casa Frida</b><span>Chelem y Chuburná, Yucatán</span></div>
    <div class="dominio">Panel de reservas</div>
  </div>
</div></body></html>
